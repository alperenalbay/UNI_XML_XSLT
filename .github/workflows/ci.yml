name: CI

# Her push ve PR'da tam doğrulama zinciri çalışır:
#   lint → build → şablon denetimi → birim testler → uçtan uca testler → buton QA'sı
#
# Not: public/templates/ klasörü .gitignore'dadır (KVKK — fatura verisi
# içerir). CI'da dizin boş olarak oluşturulur; e2e testleri kendi fixture
# şablonlarını oraya yazar ve test sonunda siler.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare template directory
        run: mkdir -p public/templates

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify (lint + build + templates + unit + e2e)
        run: npm run verify

      - name: Button QA
        run: npm run qa

      - name: Dead code check
        run: npm run deadcode
